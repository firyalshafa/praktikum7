<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Manajemen API Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
        background-color: #f4f7f9;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 50;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="app" class="min-h-screen flex flex-col items-center">
      <header class="w-full bg-white shadow-lg p-4 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
          <h1 class="text-2xl font-bold text-indigo-700">API Key Manager</h1>
          <div id="auth-controls"></div>
        </div>
      </header>

      <div
        id="content"
        class="w-full max-w-7xl p-4 sm:p-6 flex-grow"
      ></div>
    </div>

    <div id="modal" class="modal flex items-center justify-center z-50">
      <div
        class="modal-content p-6 rounded-lg shadow-2xl w-full max-w-sm transform transition-all bg-white"
      >
        <h3 id="modal-title" class="text-xl font-bold mb-3 text-gray-800">
          Pesan
        </h3>
        <p id="modal-message" class="text-gray-600 mb-4"></p>
        <button
          onclick="closeModal()"
          class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition"
        >
          Tutup
        </button>
      </div>
    </div>

    <script>
      const API_BASE_URL = "http://localhost:3001/api";
      let currentView = "user-register";
      let adminToken = localStorage.getItem("adminToken") || null;

      function showModal(title, message) {
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-message").innerText = message || "";
        document.getElementById("modal").style.display = "flex";
      }

      function closeModal() {
        document.getElementById("modal").style.display = "none";
      }

      function setView(view) {
        currentView = view;
        render();
      }

      function handleLogout() {
        adminToken = null;
        localStorage.removeItem("adminToken");
        showModal("Logout Berhasil", "Anda telah berhasil keluar.");
        setView("user-register");
      }

      async function apiFetch(
        endpoint,
        method = "GET",
        body = null,
        requireAuth = false
      ) {
        const headers = {
          "Content-Type": "application/json",
        };

        if (requireAuth && adminToken) {
          headers["Authorization"] = `Bearer ${adminToken}`;
        }

        try {
          const response = await fetch(`${API_BASE_URL}${endpoint}`, {
            method,
            headers,
            body: body ? JSON.stringify(body) : null,
          });

          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
              handleLogout();
              showModal(
                "Sesi Kadaluarsa",
                "Sesi Anda telah berakhir. Silakan login kembali."
              );
              return null;
            }
            throw new Error(data.message || `API Error: ${response.status}`);
          }

          return data;
        } catch (err) {
          console.error("Fetch Error:", err);
          showModal("Error API", err.message);
          return null;
        }
      }

      // =================== USER REGISTER ===================
      async function handleUserRegistration(event) {
        event.preventDefault();
        const form = event.target;

        const firstname = form.elements["user-firstname"].value;
        const lastname = form.elements["user-lastname"].value;
        const email = form.elements["user-email"].value;
        const out_of_date = form.elements["user-out-of-date"].value;

        const body = { firstname, lastname, email, out_of_date };

        showModal("Memproses...", "Mengirim data ke server dan membuat API Key...");

        const data = await apiFetch("/users/register", "POST", body);

        closeModal();

        const apiKeyField = document.getElementById("generated-api-key");

        if (data && data.api_key) {
          apiKeyField.value = data.api_key;
          showModal(
            "Registrasi Sukses!",
            `User berhasil terdaftar!\nAPI Key Anda sudah muncul di kolom bawah.`
          );
          form.reset();
        } else if (data && data.message) {
          showModal("Registrasi Gagal", data.message);
        }
      }

      // =================== ADMIN LOGIN ===================
      async function handleLogin(event) {
        event.preventDefault();
        const form = event.target;
        const email = form.elements["login-email"].value;
        const password = form.elements["login-password"].value;

        showModal("Memproses...", "Mencoba login admin...");

        const data = await apiFetch("/admin/login", "POST", { email, password });

        closeModal();

        if (data && data.token) {
          adminToken = data.token;
          localStorage.setItem("adminToken", data.token);
          showModal("Login Sukses", "Berhasil login sebagai Admin. Selamat datang!");
          setView("dashboard");
        }
      }

      // =================== ADMIN REGISTER ===================
      async function handleRegister(event) {
        event.preventDefault();
        const form = event.target;
        const email = form.elements["reg-email"].value;
        const password = form.elements["reg-password"].value;

        showModal("Memproses...", "Mendaftarkan admin baru...");

        const data = await apiFetch("/admin/register", "POST", { email, password });

        closeModal();

        if (data && data.message) {
          showModal("Register Sukses", data.message + " Silakan Login.");
          setView("login");
        }
      }

      // =================== ADMIN DASHBOARD ===================
      async function fetchUsers() {
        const users = await apiFetch("/admin/users", "GET", null, true);
        if (!users) return;

        const content = document.getElementById("content");
        content.innerHTML = `
          <div class="max-w-7xl mx-auto p-6 bg-white shadow-2xl rounded-xl mt-10">
            <h2 class="text-3xl font-bold text-indigo-700 mb-4">Daftar User</h2>
            <table class="table-auto w-full border-collapse border border-gray-300 text-sm">
              <thead class="bg-gray-100">
                <tr>
                  <th class="px-4 py-2 border">ID</th>
                  <th class="px-4 py-2 border">First Name</th>
                  <th class="px-4 py-2 border">Last Name</th>
                  <th class="px-4 py-2 border">Email</th>
                  <th class="px-4 py-2 border">API Key</th>
                  <th class="px-4 py-2 border">Kadaluarsa</th>
                  <th class="px-4 py-2 border">Aksi</th>
                </tr>
              </thead>
              <tbody>
                ${
                  users
                    .map(
                      (user) => `
                  <tr>
                    <td class="px-4 py-2 border">${user.iduser}</td>
                    <td class="px-4 py-2 border">${user.firstname || ""}</td>
                    <td class="px-4 py-2 border">${user.lastname || ""}</td>
                    <td class="px-4 py-2 border">${user.email || ""}</td>
                    <td class="px-4 py-2 border">${
                      user.api_key || "(belum ada)"
                    }</td>
                    <td class="px-4 py-2 border">${
                      user.out_of_date ? user.out_of_date.substring(0, 10) : "-"
                    }</td>
                    <td class="px-4 py-2 border">
                      <button onclick="handleDeleteUser(${user.iduser})"
                        class="bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 text-xs">
                        Delete
                      </button>
                    </td>
                  </tr>
                `
                    )
                    .join("")
                }
              </tbody>
            </table>
          </div>
        `;
      }

      async function handleDeleteUser(iduser) {
        if (!confirm("Yakin mau hapus user ini?")) return;

        const data = await apiFetch(
          `/admin/users/${iduser}`,
          "DELETE",
          null,
          true
        );
        if (data) {
          showModal("User Deleted", data.message || "User berhasil dihapus");
          fetchUsers();
        }
      }

      function renderAdminDashboard() {
        fetchUsers();
      }

      // =================== RENDER FORM LOGIN ===================
      function renderLoginForm() {
        const content = document.getElementById("content");
        content.innerHTML = `
          <div class="max-w-md mx-auto bg-white p-8 shadow-2xl rounded-xl mt-10">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Login Admin</h2>
            <form id="login-form" class="space-y-4">
              <div>
                <label for="login-email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="login-email" name="login-email" required
                  class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
              </div>
              <div>
                <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="login-password" name="login-password" required
                  class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
              </div>
              <button type="submit"
                class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition font-semibold">
                Login
              </button>
              <p class="text-center text-sm text-gray-600">
                Belum punya akun?
                <a href="#" onclick="setView('register')"
                  class="text-indigo-600 hover:text-indigo-800 font-medium">
                  Register di sini
                </a>
              </p>
            </form>
          </div>
        `;
        document
          .getElementById("login-form")
          .addEventListener("submit", handleLogin);
      }

      // =================== RENDER FORM REGISTER ADMIN ===================
      function renderRegisterForm() {
        const content = document.getElementById("content");
        content.innerHTML = `
          <div class="max-w-md mx-auto bg-white p-8 shadow-2xl rounded-xl mt-10">
            <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Register Admin</h2>
            <form id="register-form" class="space-y-4">
              <div>
                <label for="reg-email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="reg-email" name="reg-email" required
                  class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
              </div>
              <div>
                <label for="reg-password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="reg-password" name="reg-password" required
                  class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
              </div>
              <button type="submit"
                class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition font-semibold">
                Register
              </button>
              <p class="text-center text-sm text-gray-600">
                Sudah punya akun?
                <a href="#" onclick="setView('login')"
                  class="text-indigo-600 hover:text-indigo-800 font-medium">
                  Login di sini
                </a>
              </p>
            </form>
          </div>
        `;
        document
          .getElementById("register-form")
          .addEventListener("submit", handleRegister);
      }

      // =================== RENDER FORM REGISTER USER ===================
      function renderUserRegistrationForm() {
        const content = document.getElementById("content");
        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 30);
        const formattedDate = defaultDate.toISOString().substring(0, 10);

        content.innerHTML = `
          <div class="max-w-lg mx-auto bg-white p-8 shadow-2xl rounded-xl mt-10">
            <div class="flex justify-end mb-4">
              <button onclick="setView('login')"
                class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition text-sm">
                Login Admin
              </button>
            </div>

            <h2 class="text-3xl font-bold text-center text-indigo-600 mb-2">
              Registrasi User & API Key
            </h2>
            <p class="text-center text-sm text-gray-500 mb-6">
              API Key (otomatis) akan muncul setelah registrasi berhasil.
            </p>

            <form id="user-register-form" class="space-y-4">
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="user-firstname" class="block text-sm font-medium text-gray-700">First Name</label>
                  <input type="text" id="user-firstname" name="user-firstname" required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                  <label for="user-lastname" class="block text-sm font-medium text-gray-700">Last Name</label>
                  <input type="text" id="user-lastname" name="user-lastname"
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
              </div>
              <div>
                <label for="user-email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="user-email" name="user-email" required
                  class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
              </div>
              <div>
                <label for="user-out-of-date" class="block text-sm font-medium text-gray-700">
                  Tanggal Kadaluarsa Key (Default: +30 hari)
                </label>
                <input type="date" id="user-out-of-date" name="user-out-of-date" required
                  value="${formattedDate}"
                  class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
              </div>

              <button type="submit"
                class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 transition font-semibold">
                Daftarkan User & Buat API Key
              </button>
            </form>

            <div class="mt-6">
              <label class="block text-sm font-medium text-gray-700 mb-1">API Key Anda</label>
              <input id="generated-api-key" type="text" readonly
                class="w-full px-4 py-2 border border-indigo-300 rounded-lg bg-indigo-50 text-indigo-700 text-sm">
              <p class="text-xs text-gray-500 mt-1">
                Simpan API Key ini baik-baik. Tidak akan ditampilkan lagi setelah halaman di-refresh.
              </p>
            </div>
          </div>
        `;

        document
          .getElementById("user-register-form")
          .addEventListener("submit", handleUserRegistration);
      }

      // =================== AUTH CONTROLS ===================
      function renderAuthControls() {
        const controls = document.getElementById("auth-controls");
        controls.innerHTML = "";

        if (adminToken) {
          controls.innerHTML = `
            <button onclick="setView('dashboard')"
              class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition text-sm">
              Dashboard Admin
            </button>
            <button onclick="setView('user-register')"
              class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition text-sm ml-2">
              + User Baru & API Key
            </button>
            <button onclick="handleLogout()"
              class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition text-sm ml-2">
              Logout
            </button>
          `;
        } else {
          controls.innerHTML = `
            <button onclick="setView('register')"
              class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition text-sm">
              Register Admin
            </button>
            <button onclick="setView('login')"
              class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition text-sm ml-2">
              Login Admin
            </button>
          `;
        }
      }

      function render() {
        renderAuthControls();

        if (adminToken) {
          if (currentView === "user-register") {
            renderUserRegistrationForm();
          } else {
            renderAdminDashboard();
          }
        } else {
          if (currentView === "register") {
            renderRegisterForm();
          } else if (currentView === "login") {
            renderLoginForm();
          } else {
            renderUserRegistrationForm();
          }
        }
      }

      document.addEventListener("DOMContentLoaded", render);
    </script>
  </body>
</html>
